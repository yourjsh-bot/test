<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전자칠판 시계 & 타이머</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (아이콘용) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 노션 폰트 느낌을 위한 본고딕(Noto Sans KR) 및 Inter 계열 설정 */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 노션 라이트/다크 테마 색상 정의 */
    :root {
      --bg-color: #ffffff;
      --card-bg: #f7f7f7;
      --text-main: #37352f;
      --text-sub: #787774;
      --border-color: #e9e9e8;
      --accent-color: #2383e2;
      --accent-hover: #1a62ab;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #191919;
        --card-bg: #202020;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --border-color: #2f2f2f;
        --accent-color: #2eaadc;
        --accent-hover: #1c7fa7;
      }
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .theme-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
    }

    .text-sub {
      color: var(--text-sub);
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    /* 타이머 10초 남았을 때 빨간색 깜빡임 애니메이션 */
    @keyframes pulse-red {
      0%, 100% { color: #ef4444; opacity: 1; }
      50% { color: #f87171; opacity: 0.5; }
    }
    .timer-danger {
      animation: pulse-red 1s infinite;
    }
  </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen p-4 md:p-6 gap-4 md:gap-6">

  <!-- 왼쪽 절반: 시계 영역 -->
  <div class="flex-1 flex flex-col justify-center items-center rounded-3xl theme-card p-6 shadow-sm transition-all duration-300">
    <!-- 날짜 및 요일 -->
    <div id="date-display" class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-semibold text-sub mb-2 md:mb-4 tracking-wider">
      YYYY년 MM월 DD일 요일
    </div>
    <!-- 실시간 시간 -->
    <div id="clock-display" class="text-6xl sm:text-7xl md:text-8xl lg:text-[7.5rem] font-black tracking-tight tabular-nums select-none">
      00:00:00
    </div>
    <!-- 오전/오후 배지 -->
    <div id="ampm-display" class="mt-3 md:mt-5 px-4 py-1.5 md:px-6 md:py-2 rounded-full text-base md:text-xl font-bold uppercase tracking-widest btn-primary shadow-sm select-none">
      오전
    </div>
  </div>

  <!-- 오른쪽 절반: 타이머 영역 -->
  <div class="flex-1 flex flex-col justify-between items-center rounded-3xl theme-card p-6 shadow-sm transition-all duration-300 relative">
    
    <!-- 타이머 헤더 -->
    <div class="w-full flex justify-between items-center px-2 md:px-4">
      <span class="text-lg md:text-xl font-bold tracking-wide flex items-center gap-2">
        <i data-lucide="hourglass" class="w-5 h-5 md:w-6 md:h-6 text-[var(--accent-color)]"></i> 타이머
      </span>
      <!-- 퀵 설정 리셋 버튼 -->
      <button onclick="resetTimer()" class="p-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 transition text-sub" title="초기화">
        <i data-lucide="rotate-ccw" class="w-5 h-5 md:w-6 md:h-6"></i>
      </button>
    </div>

    <!-- 타이머 숫자 설정 및 디스플레이 -->
    <div class="flex flex-col items-center justify-center my-auto w-full">
      <div class="flex items-center justify-center gap-2 sm:gap-4 md:gap-6 select-none">
        <!-- 분 조절 컨트롤 -->
        <div class="flex flex-col items-center">
          <button onclick="adjustTime(60)" class="adjust-btn p-1.5 sm:p-2 md:p-3 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-all active:scale-95">
            <i data-lucide="chevron-up" class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-sub"></i>
          </button>
          <span id="timer-min" class="text-6xl sm:text-7xl md:text-8xl lg:text-[7.5rem] font-bold tabular-nums leading-none my-1">10</span>
          <button onclick="adjustTime(-60)" class="adjust-btn p-1.5 sm:p-2 md:p-3 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-all active:scale-95">
            <i data-lucide="chevron-down" class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-sub"></i>
          </button>
        </div>

        <!-- 구분 콜론 -->
        <span id="timer-colon" class="text-5xl sm:text-6xl md:text-7xl lg:text-[6rem] font-semibold text-sub mb-4">:</span>

        <!-- 초 조절 컨트롤 -->
        <div class="flex flex-col items-center">
          <button onclick="adjustTime(10)" class="adjust-btn p-1.5 sm:p-2 md:p-3 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-all active:scale-95">
            <i data-lucide="chevron-up" class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-sub"></i>
          </button>
          <span id="timer-sec" class="text-6xl sm:text-7xl md:text-8xl lg:text-[7.5rem] font-bold tabular-nums leading-none my-1">00</span>
          <button onclick="adjustTime(-10)" class="adjust-btn p-1.5 sm:p-2 md:p-3 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-all active:scale-95">
            <i data-lucide="chevron-down" class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-sub"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 타이머 하단 제어부 -->
    <div class="w-full max-w-md flex flex-col gap-3">
      <!-- 프리셋 퀵 버튼들 (교실 단골 시간) -->
      <div id="preset-container" class="flex justify-center gap-2">
        <button onclick="setPreset(180)" class="px-3 py-1.5 rounded-lg border border-[var(--border-color)] hover:bg-black/5 dark:hover:bg-white/5 text-sm font-semibold transition">3분</button>
        <button onclick="setPreset(300)" class="px-3 py-1.5 rounded-lg border border-[var(--border-color)] hover:bg-black/5 dark:hover:bg-white/5 text-sm font-semibold transition">5분</button>
        <button onclick="setPreset(600)" class="px-3 py-1.5 rounded-lg border border-[var(--border-color)] hover:bg-black/5 dark:hover:bg-white/5 text-sm font-semibold transition">10분</button>
        <button onclick="setPreset(1200)" class="px-3 py-1.5 rounded-lg border border-[var(--border-color)] hover:bg-black/5 dark:hover:bg-white/5 text-sm font-semibold transition">20분</button>
      </div>

      <!-- 시작/정지/리셋 컨트롤 버튼 -->
      <div class="flex gap-3 justify-center items-center mt-1">
        <button id="start-btn" onclick="toggleTimer()" class="flex-1 btn-primary py-3 md:py-4 px-6 rounded-2xl font-bold text-lg md:text-xl flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-md">
          <i id="start-icon" data-lucide="play" class="w-5 h-5 md:w-6 md:h-6 fill-current"></i>
          <span id="start-text">시작</span>
        </button>
      </div>
    </div>

  </div>

  <!-- 알림음 음소거 해제 권장 안내 배너 (모바일/크롬 자동재생 방지 대책) -->
  <div id="audio-guide" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-yellow-500 text-slate-900 px-4 py-2 rounded-full font-bold shadow-lg flex items-center gap-2 text-sm z-50 transition-opacity duration-500 opacity-0 pointer-events-none">
    <i data-lucide="volume-2" class="w-4 h-4"></i>
    <span>화면을 한 번 클릭하면 알림음이 활성화됩니다!</span>
  </div>

  <script>
    // Lucide 아이콘 초기화
    lucide.createIcons();

    // ----------------------------------------------------
    // [시계 기능]
    // ----------------------------------------------------
    const daysKR = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

    function updateClock() {
      const now = new Date();
      
      // 날짜 포맷
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const day = daysKR[now.getDay()];
      document.getElementById('date-display').textContent = `${year}년 ${month}월 ${date}일 ${day}`;

      // 시간 포맷
      let hours = now.getHours();
      const ampm = hours >= 12 ? '오후' : '오전';
      document.getElementById('ampm-display').textContent = ampm;

      // 12시간제로 표시하되, 보기 편하도록 변경 (오전 12시 -> 12, 오후 1시 -> 1)
      hours = hours % 12;
      hours = hours ? hours : 12; 
      const hoursStr = String(hours).padStart(2, '0');
      const minutesStr = String(now.getMinutes()).padStart(2, '0');
      const secondsStr = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clock-display').textContent = `${hoursStr}:${minutesStr}:${secondsStr}`;
    }

    // 1초마다 시계 업데이트
    setInterval(updateClock, 1000);
    updateClock(); // 첫 로드 시 즉시 실행

    // ----------------------------------------------------
    // [타이머 기능]
    // ----------------------------------------------------
    let timerDuration = 600; // 기본값 10분 (초 단위)
    let timeRemaining = timerDuration;
    let timerInterval = null;
    let isRunning = false;

    // Web Audio API를 이용한 음원 합성 (서버 오디오 파일 의존성 제거)
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // 안내 배너 숨김
        const guide = document.getElementById('audio-guide');
        guide.classList.add('opacity-0');
        guide.classList.add('pointer-events-none');
      }
    }

    // 사용자 인터랙션 발생 시 오디오 컨텍스트 자동 잠금해제 유도
    window.addEventListener('click', initAudio, { once: false });
    window.addEventListener('touchstart', initAudio, { once: false });

    // 학교 종소리 멜로디 연주 (솔-미-레-도-도-레-미-솔...)
    function playSchoolBell() {
      initAudio();
      if (!audioCtx) return;

      // 오디오 컨텍스트가 정지 상태(Suspended)인 경우 풀기
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // 음계 주파수 테이블
      const notes = {
        'C4': 261.63, // 도
        'D4': 293.66, // 레
        'E4': 329.63, // 미
        'G4': 392.00  // 솔
      };

      // 동요 "학교종" 계이름과 박자 (1 = 한 박자, 2 = 두 박자)
      const melody = [
        { note: 'G4', duration: 1 }, { note: 'G4', duration: 1 }, { note: 'E4', duration: 1 }, { note: 'E4', duration: 1 },
        { note: 'G4', duration: 1 }, { note: 'G4', duration: 1 }, { note: 'E4', duration: 2 },
        { note: 'G4', duration: 1 }, { note: 'G4', duration: 1 }, { note: 'E4', duration: 1 }, { note: 'E4', duration: 1 },
        { note: 'D4', duration: 1 }, { note: 'D4', duration: 1 }, { note: 'C4', duration: 2 }
      ];

      let tempo = 450; // 한 박자의 길이 (ms)
      let currentTime = audioCtx.currentTime;

      melody.forEach(item => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        // 칠판 종소리와 유사하게 부드러운 사인(Sine)파와 실로폰 느낌의 삼각(Triangle)파 합성
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(notes[item.note], currentTime);

        // 엔벨로프 설정 (부드러운 소리 깎임)
        gainNode.gain.setValueAtTime(0, currentTime);
        gainNode.gain.linearRampToValueAtTime(0.3, currentTime + 0.05); // Attack
        gainNode.gain.exponentialRampToValueAtTime(0.001, currentTime + (item.duration * (tempo / 1000)) - 0.05); // Release

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(currentTime);
        osc.stop(currentTime + (item.duration * (tempo / 1000)));

        // 다음 노트 시간 계산
        currentTime += (item.duration * (tempo / 1000));
      });
    }

    // 타이머 디스플레이 새로고침
    function updateTimerDisplay() {
      const min = Math.floor(timeRemaining / 60);
      const sec = timeRemaining % 60;

      const minEl = document.getElementById('timer-min');
      const secEl = document.getElementById('timer-sec');
      const colonEl = document.getElementById('timer-colon');

      minEl.textContent = String(min).padStart(2, '0');
      secEl.textContent = String(sec).padStart(2, '0');

      // 10초 이하 남았을 때 시각적 경고 효과 (빨간색 깜빡임)
      if (timeRemaining <= 10 && timeRemaining > 0 && isRunning) {
        minEl.classList.add('timer-danger');
        secEl.classList.add('timer-danger');
        colonEl.classList.add('timer-danger');
      } else {
        minEl.classList.remove('timer-danger');
        secEl.classList.remove('timer-danger');
        colonEl.classList.remove('timer-danger');
      }
    }

    // 시간 가감 (버튼 제어)
    function adjustTime(seconds) {
      if (isRunning) return; // 실행 중에는 조절 불가
      
      timeRemaining = Math.max(0, timeRemaining + seconds);
      timerDuration = timeRemaining;
      updateTimerDisplay();
    }

    // 퀵 프리셋 설정
    function setPreset(seconds) {
      if (isRunning) return;
      timerDuration = seconds;
      timeRemaining = seconds;
      updateTimerDisplay();
    }

    // 시작 및 정지 토글
    function toggleTimer() {
      if (isRunning) {
        // 일시정지
        clearInterval(timerInterval);
        isRunning = false;
        updateUIState();
      } else {
        // 이미 완료된 상태에서 누르면 원래 세팅 시간으로 자동 리셋 후 시작
        if (timeRemaining === 0) {
          timeRemaining = timerDuration || 600;
        }

        // 브라우저 소리 재생 가이드 노출 조건 확인
        if (!audioCtx) {
          const guide = document.getElementById('audio-guide');
          guide.classList.remove('opacity-0', 'pointer-events-none');
          setTimeout(() => {
            guide.classList.add('opacity-0', 'pointer-events-none');
          }, 4000);
        }

        isRunning = true;
        updateUIState();

        timerInterval = setInterval(() => {
          if (timeRemaining > 0) {
            timeRemaining--;
            updateTimerDisplay();
          } else {
            // 시간 만료
            clearInterval(timerInterval);
            isRunning = false;
            updateUIState();
            playSchoolBell(); // 학교종소리 재생
          }
        }, 1000);
      }
    }

    // 타이머 전체 초기화
    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeRemaining = timerDuration;
      updateTimerDisplay();
      updateUIState();
    }

    // 상태에 맞춰 UI 레이아웃 업데이트 (시작 <-> 일시정지 아이콘 및 조절 버튼 비활성화)
    function updateUIState() {
      const startText = document.getElementById('start-text');
      const startIcon = document.getElementById('start-icon');
      const adjustBtns = document.querySelectorAll('.adjust-btn');
      const presetBtns = document.getElementById('preset-container').querySelectorAll('button');

      if (isRunning) {
        startText.textContent = "일시정지";
        startIcon.setAttribute('data-lucide', 'pause');
        // 시간 조절 버튼 및 프리셋 투명도 및 이벤트 처리 비활성화
        adjustBtns.forEach(btn => btn.style.opacity = '0.2');
        presetBtns.forEach(btn => btn.style.opacity = '0.3');
      } else {
        startText.textContent = "시작";
        startIcon.setAttribute('data-lucide', 'play');
        adjustBtns.forEach(btn => btn.style.opacity = '1');
        presetBtns.forEach(btn => btn.style.opacity = '1');
      }
      lucide.createIcons();
    }

    // 첫 세팅 로드
    updateTimerDisplay();

    // ----------------------------------------------------
    // [노션 전용 테마 감지 강화 스크립트]
    // ----------------------------------------------------
    // 노션은 자체 iframe 환경 안에서 body 클래스나 부모 테마 설정을 변경할 때가 있으므로
    // 기본 미디어 쿼리 감지 외에, 주기적으로 상위 도큐먼트나 본인 클래스 감시(MutationObserver) 처리 보조
    const query = window.matchMedia('(prefers-color-scheme: dark)');
    
    function applyTheme() {
      // 라이트/다크에 따라 CSS 변수 자동 적용
      // 기본적으로 브라우저의 기본 미디어 쿼리가 우선 반응하도록 작동합니다.
    }
    
    query.addEventListener('change', applyTheme);
    applyTheme();
  </script>
</body>
</html>
